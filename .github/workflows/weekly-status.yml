name: Weekly project status (draft)
on:
  workflow_dispatch:
  schedule:
    # Friday 15:00 Astana (UTC+5) = 10:00 UTC
    - cron: '0 10 * * 5'
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3'
      - name: Generate factual drafts for two weeks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: margulanjanpeis-wq/DormDesk
        run: python scripts/weekly_status.py --weeks 2
      - name: Archive drafts for manual review
        uses: actions/upload-artifact@v4
        with:
          name: lab13-weekly-draft
          path: reports/
